name: build-doors
on:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sunday 06:00 UTC (decision U1 cadence)
  push:
    paths-ignore: # don't rebuild for docs-only changes
      - "**.md"
      - "branding/**"
      - "docs/**"
  pull_request:
  merge_group:
  workflow_dispatch: # manual build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false # don't cancel the whole matrix when one image fails
      matrix:
        recipe:
          - doors.yml
          - doors-wl.yml
          - doors-cosmic.yml
          - doors-nvidia.yml
          - doors-wl-nvidia.yml
          - doors-cosmic-nvidia.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the build is fully handled by the reusable BlueBuild action
      - name: Build Doors image
        uses: blue-build/github-action@v1.11
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
