name: Build and publish stable Doors images

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - 'audit/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable and daily staging releases share one trusted-publication lock. That
  # makes the staging workflow's latest-tag integrity check race-free, while PR
  # and merge-queue verification retain independent per-ref cancellation.
  group: >-
    ${{ github.repository == 'mheci/doors' && github.ref == 'refs/heads/main' &&
    'doors-trusted-publication' || format('doors-stable-{0}', github.ref) }}
  # Never interrupt a trusted publication after it may have pushed an image.
  # Disposable PR and merge-queue verification may supersede an older run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

jobs:
  # Every event validates all recipe/profile isolation and workflow invariants
  # before an image build can run.
  contract:
    name: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image contract and static trust material
        run: ./scripts/validate-repository.sh

  # PRs and merge-queue entries compose every stable desktop with an ephemeral
  # key. They cannot receive the publication secret or write a package.
  verification:
    name: verify (${{ matrix.id }})
    needs: contract
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            recipe: doors.yml
          - id: doors-cosmic
            recipe: doors-cosmic.yml
          - id: doors-kinoite
            recipe: doors-kinoite.yml
    runs-on: ubuntu-latest
    # One normal build plus one bounded upstream-metadata retry, never an
    # unbounded wait or resolver/verification bypass.
    timeout-minutes: 240
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare attestation-verified Herdr artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-herdr.sh

      - name: Install Cosign for the ephemeral test key
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Generate ephemeral non-publishing signing key
        id: ephemeral_cosign
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_PASSWORD='' cosign generate-key-pair --output-key-prefix "${RUNNER_TEMP}/doors-test-cosign"
          {
            echo 'private_key<<EOF'
            cat "${RUNNER_TEMP}/doors-test-cosign.key"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.id }} without publishing
        id: verification_build
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          COSIGN_PASSWORD: ''
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ steps.ephemeral_cosign.outputs.private_key }}
          registry_token: ${{ github.token }}
          push: false
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Wait for upstream package metadata convergence
        if: steps.verification_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 300

      # The BlueBuild action invokes slsa-verifier. Remove only its cache so
      # the bounded retry re-installs and re-verifies that tool.
      - name: Reset SLSA verifier cache before retry
        if: steps.verification_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "${HOME}/.slsa"

      - name: Retry ${{ matrix.id }} non-publishing build once
        id: verification_build_retry
        if: steps.verification_build.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          COSIGN_PASSWORD: ''
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ steps.ephemeral_cosign.outputs.private_key }}
          registry_token: ${{ github.token }}
          push: false
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Fail closed if retry did not recover
        if: always() && steps.verification_build.outcome == 'failure' && steps.verification_build_retry.outcome != 'success'
        shell: bash
        run: |
          echo 'The build still failed after the bounded upstream-convergence retry.' >&2
          exit 1

  # The protected status remains a single, non-matrix `image` check while the
  # matrix exposes which desktop failed.
  image:
    name: image
    needs: verification
    if: >-
      always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every stable desktop build
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFICATION_RESULT}" == 'success' ]] || {
            echo "Stable image verification result: ${VERIFICATION_RESULT}" >&2
            exit 1
          }

  # Only trusted main executions can read SIGNING_SECRET or write GHCR. Each
  # matrix cell publishes exactly one package then stores the immutable digest
  # as a short-lived workflow artifact for a fresh-runner scan/attestation job.
  image_publish:
    name: image-publish (${{ matrix.id }})
    needs: contract
    if: >-
      github.repository == 'mheci/doors' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            recipe: doors.yml
            package: doors
            tag: latest
          - id: doors-cosmic
            recipe: doors-cosmic.yml
            package: doors-cosmic
            tag: latest
          - id: doors-kinoite
            recipe: doors-kinoite.yml
            package: doors-kinoite
            tag: latest
    # Limit the secret to the protected publishing environment. Configure this
    # environment to permit main only, with no reviewer gate for normal main.
    environment: ghcr-publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      attestations: read
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare attestation-verified Herdr artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/prepare-herdr.sh

      - name: Build, sign, and publish ghcr.io/mheci/${{ matrix.package }}:${{ matrix.tag }}
        id: publish_build
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Wait for upstream package metadata convergence
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 300

      - name: Reset SLSA verifier cache before retry
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "${HOME}/.slsa"

      - name: Retry signed publication build once
        id: publish_build_retry
        if: steps.publish_build.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Fail closed if retry did not recover
        if: always() && steps.publish_build.outcome == 'failure' && steps.publish_build_retry.outcome != 'success'
        shell: bash
        run: |
          echo 'The publication build still failed after the bounded upstream-convergence retry.' >&2
          exit 1

      - name: Resolve immutable published digest
        env:
          IMAGE: ghcr.io/mheci/${{ matrix.package }}
          TAG: ${{ matrix.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg name "${IMAGE}" --arg tag "${TAG}" --arg digest "${digest}" \
            '{name: $name, tag: $tag, digest: $digest}' > image.json
          docker logout ghcr.io

      - name: Hand off immutable identity to fresh-runner release checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doors-published-${{ matrix.id }}
          path: image.json
          if-no-files-found: error
          retention-days: 1

  # This separate matrix runs after publication on fresh hosted runners. It
  # scans and attests the precise digest handed off above, never a mutable tag.
  publish:
    name: publish (${{ matrix.id }})
    needs: image_publish
    if: needs.image_publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            package: doors
            tag: latest
          - id: doors-cosmic
            package: doors-cosmic
            tag: latest
          - id: doors-kinoite
            package: doors-kinoite
            tag: latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Download immutable image identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: doors-published-${{ matrix.id }}
          path: identity

      - name: Validate immutable image identity
        env:
          EXPECTED_IMAGE: ghcr.io/mheci/${{ matrix.package }}
          EXPECTED_TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f identity/image.json
          name="$(jq -er '.name' identity/image.json)"
          tag="$(jq -er '.tag' identity/image.json)"
          digest="$(jq -er '.digest' identity/image.json)"
          [[ "${name}" == "${EXPECTED_IMAGE}" ]]
          [[ "${tag}" == "${EXPECTED_TAG}" ]]
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "IMAGE=${name}"
            echo "DIGEST=${digest}"
          } >> "$GITHUB_ENV"

      - name: Install checksum-verified Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          # Dependabot owns the action pin; Renovate owns this release version.
          version: v0.74.0 # renovate: trivy-release
          cache: false

      - name: Generate SPDX SBOM for immutable image digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/trivy-registry-config"
          export TRIVY_CACHE_DIR="${RUNNER_TEMP}/trivy-cache"
          trap 'rm -rf -- "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"' EXIT
          mkdir -p "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"
          printf '%s' "${REGISTRY_TOKEN}" | trivy registry login \
            --username "${GITHUB_ACTOR}" --password-stdin ghcr.io
          trivy image --quiet --parallel 1 --timeout 45m --format spdx-json \
            --output doors.sbom.spdx.json "${IMAGE}@${DIGEST}"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          sbom = json.loads(Path('doors.sbom.spdx.json').read_text(encoding='utf-8'))
          if not str(sbom.get('spdxVersion', '')).startswith('SPDX-'):
              raise SystemExit('Trivy did not emit SPDX JSON')
          if not sbom.get('packages'):
              raise SystemExit('Trivy emitted an empty SPDX package inventory')
          PYTHON

      - name: Authenticate GHCR for registry attestations
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SPDX SBOM with GitHub OIDC
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: doors.sbom.spdx.json
          push-to-registry: true

      - name: Remove ephemeral GHCR attestation credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
