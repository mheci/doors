name: Build and publish stable Doors images

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    # Weekly rebuild so Fedora, Terra, NVIDIA, and Proton updates reach the
    # stable images without a commit. Sunday 03:00 UTC, ahead of the client
    # doors-update.timer window (Sunday 04:30 local).
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Stable and daily staging releases share one trusted-publication lock. That
  # makes the staging workflow's latest-tag integrity check race-free, while PR
  # and merge-queue verification retain independent per-ref cancellation.
  group: >-
    ${{ github.repository == 'mheci/doors' && github.ref == 'refs/heads/main' &&
    'doors-trusted-publication' || format('doors-stable-{0}', github.ref) }}
  # Never interrupt a trusted publication after it may have pushed an image.
  # Disposable PR and merge-queue verification may supersede an older run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') }}

jobs:
  # PRs and merge-queue entries compose every stable desktop with ephemeral
  # Cosign and MOK material. They cannot receive either publication secret or
  # write a package.
  verification:
    name: verify (${{ matrix.id }})
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            recipe: doors.yml
          - id: doors-cosmic
            recipe: doors-cosmic.yml
          - id: doors-kinoite
            recipe: doors-kinoite.yml
    runs-on: ubuntu-latest
    # One normal build plus one bounded upstream-metadata retry, never an
    # unbounded wait or resolver/verification bypass.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read # Authenticates GHCR pulls for public BlueBuild bases.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign for the ephemeral test key
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Generate ephemeral non-publishing signing key
        shell: bash
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/doors-test-cosign.key"
          COSIGN_PASSWORD='' cosign generate-key-pair --output-key-prefix "${RUNNER_TEMP}/doors-test-cosign"
          # Do not expose a generated signing PEM through an action input or
          # output before it is dynamically masked for this disposable runner.
          while IFS= read -r pem_line; do
            printf '::add-mask::%s\n' "${pem_line}"
          done < "${key}"
          {
            echo 'DOORS_TEST_COSIGN_PRIVATE_KEY<<DOORS_TEST_COSIGN_EOF'
            cat "${key}"
            echo DOORS_TEST_COSIGN_EOF
          } >> "$GITHUB_ENV"

      - name: Generate ephemeral non-publishing MOK material
        id: ephemeral_mok
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="${RUNNER_TEMP}/doors-test-mok.key"
          certificate_pem="${RUNNER_TEMP}/doors-test-mok.pem"
          certificate_der="${RUNNER_TEMP}/doors-test-mok.der"
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout "${key}" \
            -out "${certificate_pem}" \
            -days 3650 \
            -subj '/CN=Doors Secure Boot MOK/' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'keyUsage=critical,digitalSignature' \
            -addext 'extendedKeyUsage=codeSigning' \
            -addext 'subjectKeyIdentifier=hash' \
            -addext 'authorityKeyIdentifier=keyid' >/dev/null 2>&1
          openssl x509 -in "${certificate_pem}" -outform DER -out "${certificate_der}"
          install -m 0644 "${certificate_der}" \
            files/common/usr/share/doors/secureboot/doors-mok.der
          fingerprint="$(openssl x509 -in "${certificate_pem}" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr 'A-F' 'a-f')"
          printf 'sha256:%s\n' "${fingerprint}" \
            > files/common/usr/share/doors/secureboot/doors-mok.fingerprint
          # A multiline PEM cannot safely travel through a step output: the
          # action input diagnostic would expose an unmasked generated key.
          # Mask each PEM line first, then put it in the ephemeral job
          # environment for the following non-publishing BlueBuild attempts.
          # GITHUB_ENV values are available only to later steps on this runner.
          while IFS= read -r pem_line; do
            printf '::add-mask::%s\n' "${pem_line}"
          done < "${key}"
          {
            echo 'DOORS_MOK_SIGNING_KEY<<DOORS_MOK_EOF'
            cat "${key}"
            echo DOORS_MOK_EOF
          } >> "$GITHUB_ENV"

      # BlueBuild writes an OCI archive instead of a mutable local Docker tag.
      # The archive is the only candidate handoff accepted by the boot gate.
      - name: Prepare non-published candidate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/doors-candidate"

      - name: Build ${{ matrix.id }} without publishing
        id: verification_build
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          BB_BUILD_ARCHIVE: ${{ runner.temp }}/doors-candidate
          COSIGN_PASSWORD: ''
          # The masked candidate-only MOK is inherited from GITHUB_ENV; this
          # non-publishing action never receives a production secret.
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ env.DOORS_TEST_COSIGN_PRIVATE_KEY }}
          registry_token: ${{ github.token }}
          push: false
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Wait for upstream package metadata convergence
        if: steps.verification_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 300

      # The BlueBuild action invokes slsa-verifier. Remove only its cache so
      # the bounded retry re-installs and re-verifies that tool.
      - name: Reset SLSA verifier cache before retry
        if: steps.verification_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "${HOME}/.slsa"

      - name: Remove incomplete candidate archive before retry
        if: steps.verification_build.outcome == 'failure'
        shell: bash
        env:
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/doors-candidate/${{ matrix.id }}.tar.gz
        run: |
          set -euo pipefail
          rm -f -- "${CANDIDATE_ARCHIVE}"

      - name: Retry ${{ matrix.id }} non-publishing build once
        id: verification_build_retry
        if: steps.verification_build.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          BB_BUILD_ARCHIVE: ${{ runner.temp }}/doors-candidate
          COSIGN_PASSWORD: ''
          # The masked candidate-only MOK is inherited from GITHUB_ENV; this
          # non-publishing action never receives a production secret.
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ env.DOORS_TEST_COSIGN_PRIVATE_KEY }}
          registry_token: ${{ github.token }}
          push: false
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Fail closed if retry did not recover
        if: always() && steps.verification_build.outcome == 'failure' && steps.verification_build_retry.outcome != 'success'
        shell: bash
        run: |
          echo 'The build still failed after the bounded upstream-convergence retry.' >&2
          exit 1

      - name: Remove ephemeral candidate MOK private key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            "${RUNNER_TEMP}/doors-test-mok.key" \
            "${RUNNER_TEMP}/doors-test-mok.pem" \
            "${RUNNER_TEMP}/doors-test-cosign.key" \
            "${RUNNER_TEMP}/doors-test-cosign.pub"
          # Do not carry candidate-only private values into QCOW2/QEMU or
          # failure-artifact steps after both possible compose attempts finish.
          {
            printf 'DOORS_MOK_SIGNING_KEY=\n'
            printf 'DOORS_TEST_COSIGN_PRIVATE_KEY=\n'
          } >> "$GITHUB_ENV"

      # The OCI archive is now the only artifact needed from Docker. Reclaim
      # BuildKit and unused container stores before osbuild allocates its large
      # temporary deployment and QCOW2 output on the same hosted-runner disk.
      - name: Reclaim compose cache before QCOW2 materialization
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk usage before compose-cache reclamation:'
          df -h /
          docker buildx ls
          # BlueBuild owns the durable docker-container builder that holds the
          # just-finished compose cache. A buildx list also reports its node
          # (`bluebuild0`), which is not itself a builder name, so target the
          # documented builder and then prune the selected runner builder.
          if docker buildx inspect bluebuild >/dev/null 2>&1; then
            docker buildx prune --builder bluebuild --all --force
          fi
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          sudo podman system prune --all --force --volumes
          echo 'Disk usage after compose-cache reclamation:'
          df -h /

      # This consumes the locally composed OCI archive, not a registry tag or
      # a Docker image-store guess. Root Podman is deliberately the source for
      # bootc-image-builder's containers-storage input.
      - name: Materialize ${{ matrix.id }} candidate as a QCOW2 disk
        shell: bash
        env:
          BOOTC_IMAGE_BUILDER: ghcr.io/osbuild/bootc-image-builder:v83.0.0@sha256:e7aadce6b3f5639cd47d83354791931ea219891a0d113c2fe74a0f0d352b165c
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/doors-candidate/${{ matrix.id }}.tar.gz
          CANDIDATE_IMAGE: localhost/doors-boot-test:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p boot-test/artifacts
          test -s "${CANDIDATE_ARCHIVE}"
          {
            printf 'candidate-archive=%s\n' "${CANDIDATE_ARCHIVE}"
            printf 'candidate-image=%s\n' "${CANDIDATE_IMAGE}"
            sha256sum "${CANDIDATE_ARCHIVE}"
          } > boot-test/artifacts/candidate-source.txt

          # Docker Buildx produced an OCI archive. Import it explicitly into
          # root Podman's store; Docker and root Podman stores are independent.
          sudo skopeo copy "oci-archive:${CANDIDATE_ARCHIVE}" \
            "containers-storage:${CANDIDATE_IMAGE}"
          sudo podman image inspect "${CANDIDATE_IMAGE}" \
            | tee boot-test/artifacts/candidate-image-inspect.json > /dev/null
          # The source digest is already retained in candidate-source.txt and
          # root Podman now owns the exact imported candidate. Remove the
          # duplicate archive before osbuild makes its temporary disk images.
          rm -f -- "${CANDIDATE_ARCHIVE}"
          echo 'Disk usage before QCOW2 materialization:'
          df -h /

          cat > "${RUNNER_TEMP}/doors-bootc-config.toml" <<'TOML'
          # A bootc deployment retains OSTree objects while materializing the
          # image. This CI-only test disk needs headroom for that transaction;
          # it does not change the composed OCI image or its shipped layout.
          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "40 GiB"

          [customizations.kernel]
          append = "console=tty0 console=ttyS0,115200n8"
          TOML

          sudo podman pull --quiet "${BOOTC_IMAGE_BUILDER}"
          sudo podman image inspect "${BOOTC_IMAGE_BUILDER}" \
            | tee boot-test/artifacts/bootc-image-builder-inspect.json > /dev/null
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=disable \
            -v "${RUNNER_TEMP}/doors-bootc-config.toml:/config.toml:ro" \
            -v "${PWD}/boot-test/artifacts:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BOOTC_IMAGE_BUILDER}" \
            build \
            --type qcow2 \
            --output /output \
            --rootfs ext4 \
            --config /config.toml \
            --chown "$(id -u):$(id -g)" \
            --progress verbose \
            "${CANDIDATE_IMAGE}" 2>&1 | tee boot-test/artifacts/bootc-image-builder.log
          test -s boot-test/artifacts/qcow2/disk.qcow2

      - name: Boot ${{ matrix.id }} QCOW2 with direct os-autoinst
        timeout-minutes: 30
        shell: bash
        env:
          # qemu-x86 is the upstream no-KVM runner variant; pin its current
          # linux/amd64 manifest, not a mutable tag or expired manifest list.
          ISOTOVIDEO_IMAGE: registry.opensuse.org/devel/openqa/containers/isotovideo:qemu-x86@sha256:273253ef539b8d78bdb0f235831222c1270da1b65d88c680e1a59b67be7dadcf
        run: |
          set -euo pipefail
          test -s boot-test/artifacts/qcow2/disk.qcow2
          podman pull --quiet "${ISOTOVIDEO_IMAGE}"
          # The serial-only distribution intentionally has no visual needles,
          # but os-autoinst requires this existing repository-local directory.
          # Podman does not inherit the runner's CI marker; set it so upstream
          # os-autoinst skips its non-CI scratch-disk reservation preflight.
          podman run --rm --pull=never \
            --env CI=1 \
            -v "${PWD}/boot-test:/tests:ro" \
            -v "${PWD}/boot-test/artifacts:/work" \
            -w /work \
            "${ISOTOVIDEO_IMAGE}" \
            --exit-status-from-test-results \
            QEMU_NO_KVM=1 \
            CASEDIR=/tests \
            NEEDLES_DIR=needles \
            HDD_1=qcow2/disk.qcow2 \
            BOOT_HDD_IMAGE=1 \
            BOOTFROM=disk \
            ARCH=x86_64 \
            UEFI=1 \
            UEFI_SECURE_BOOT=0 \
            QEMURAM=4096 \
            QEMUCPUS=2 \
            SCHEDULE=tests/boot.pm

      - name: Upload failed boot-validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doors-boot-${{ matrix.id }}-${{ github.run_attempt }}
          # Keep serial/test/BIB diagnostics, but not the generated 40 GiB
          # QCOW2 itself. The source archive identity is recorded separately;
          # retaining raw virtual disks would exhaust CI artifact storage while
          # adding no useful first-line boot-failure evidence.
          path: |
            boot-test/artifacts
            !boot-test/artifacts/qcow2/disk.qcow2
          if-no-files-found: warn
          retention-days: 7

  # The protected status remains a single, non-matrix `image` check while the
  # matrix exposes which desktop failed.
  image:
    name: image
    needs: verification
    if: >-
      always() && (github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every stable desktop build
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFICATION_RESULT}" == 'success' ]] || {
            echo "Stable image verification result: ${VERIFICATION_RESULT}" >&2
            exit 1
          }

  # Only trusted main executions can read SIGNING_SECRET or the production
  # MOK key in ghcr-publish, or write GHCR. Each
  # matrix cell publishes exactly one package then stores the immutable digest
  # as a short-lived workflow artifact for a fresh-runner scan/attestation job.
  image_publish:
    name: image-publish (${{ matrix.id }})
    if: >-
      github.repository == 'mheci/doors' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            recipe: doors.yml
            package: doors
            tag: latest
          - id: doors-cosmic
            recipe: doors-cosmic.yml
            package: doors-cosmic
            tag: latest
          - id: doors-kinoite
            recipe: doors-kinoite.yml
            package: doors-kinoite
            tag: latest
    # Limit the secret to the protected publishing environment. Configure this
    # environment to permit main only, with no reviewer gate for normal main.
    environment: ghcr-publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # Pushes signed OCI images to the Doors GHCR packages.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, sign, and publish ghcr.io/mheci/${{ matrix.package }}:${{ matrix.tag }}
        id: publish_build
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          # ghcr-publish is main-only; BlueBuild mounts this only in the late
          # secure-boot module as /run/secrets/doors-mok.key.
          DOORS_MOK_SIGNING_KEY: ${{ secrets.DOORS_MOK_SIGNING_KEY }}
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Wait for upstream package metadata convergence
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 300

      - name: Reset SLSA verifier cache before retry
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "${HOME}/.slsa"

      - name: Retry signed publication build once
        id: publish_build_retry
        if: steps.publish_build.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          # ghcr-publish is main-only; BlueBuild mounts this only in the late
          # secure-boot module as /run/secrets/doors-mok.key.
          DOORS_MOK_SIGNING_KEY: ${{ secrets.DOORS_MOK_SIGNING_KEY }}
        with:
          recipe: ${{ matrix.recipe }}
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          pr_event_number: ${{ github.event.number || 0 }}
          maximize_build_space: true
          skip_checkout: true

      - name: Fail closed if retry did not recover
        if: always() && steps.publish_build.outcome == 'failure' && steps.publish_build_retry.outcome != 'success'
        shell: bash
        run: |
          echo 'The publication build still failed after the bounded upstream-convergence retry.' >&2
          exit 1

      - name: Resolve immutable published digest
        env:
          IMAGE: ghcr.io/mheci/${{ matrix.package }}
          TAG: ${{ matrix.tag }}
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg name "${IMAGE}" --arg tag "${TAG}" --arg digest "${digest}" \
            '{name: $name, tag: $tag, digest: $digest}' > image.json
          docker logout ghcr.io

      - name: Hand off immutable identity to fresh-runner release checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doors-published-${{ matrix.id }}
          path: image.json
          if-no-files-found: error
          retention-days: 1

  # This separate matrix runs after publication on fresh hosted runners. It
  # scans and attests the precise digest handed off above, never a mutable tag.
  publish:
    name: publish (${{ matrix.id }})
    needs: image_publish
    if: needs.image_publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: doors
            package: doors
            tag: latest
          - id: doors-cosmic
            package: doors-cosmic
            tag: latest
          - id: doors-kinoite
            package: doors-kinoite
            tag: latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write # Publishes provenance and SBOM attestations.
      contents: read
      id-token: write # Exchanges GitHub OIDC identity for the attestation issuer.
      packages: read # Reads the published image digest for SBOM generation.
    steps:
      - name: Download immutable image identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: doors-published-${{ matrix.id }}
          path: identity

      - name: Validate immutable image identity
        env:
          EXPECTED_IMAGE: ghcr.io/mheci/${{ matrix.package }}
          EXPECTED_TAG: ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f identity/image.json
          name="$(jq -er '.name' identity/image.json)"
          tag="$(jq -er '.tag' identity/image.json)"
          digest="$(jq -er '.digest' identity/image.json)"
          [[ "${name}" == "${EXPECTED_IMAGE}" ]]
          [[ "${tag}" == "${EXPECTED_TAG}" ]]
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "IMAGE=${name}"
            echo "DIGEST=${digest}"
          } >> "$GITHUB_ENV"

      # Pulled straight from the release download URL and checked against the
      # published checksums, so this step never touches the rate-limited
      # GitHub API from a shared runner address.
      - name: Install checksum-verified Trivy
        shell: bash
        env:
          # Renovate owns this release version.
          TRIVY_VERSION: v0.74.0 # renovate: trivy-release
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${dir}" && cd "${dir}"
          ver="${TRIVY_VERSION#v}"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          for f in "trivy_${ver}_Linux-64bit.tar.gz" "trivy_${ver}_checksums.txt"; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 5 --retry-delay 10 --output "${f}" "${base}/${f}"
          done
          grep " trivy_${ver}_Linux-64bit.tar.gz\$" "trivy_${ver}_checksums.txt" | sha256sum --check --status
          tar --extract --gzip --file "trivy_${ver}_Linux-64bit.tar.gz" trivy
          rm -f "trivy_${ver}_Linux-64bit.tar.gz" "trivy_${ver}_checksums.txt"
          echo "${dir}" >> "${GITHUB_PATH}"
          ./trivy --version

      - name: Generate SPDX SBOM for immutable image digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/trivy-registry-config"
          export TRIVY_CACHE_DIR="${RUNNER_TEMP}/trivy-cache"
          trap 'rm -rf -- "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"' EXIT
          mkdir -p "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"
          printf '%s' "${REGISTRY_TOKEN}" | trivy registry login \
            --username "${GITHUB_ACTOR}" --password-stdin ghcr.io
          trivy image --quiet --parallel 1 --timeout 45m --format spdx-json \
            --output doors.sbom.spdx.json "${IMAGE}@${DIGEST}"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          sbom = json.loads(Path('doors.sbom.spdx.json').read_text(encoding='utf-8'))
          if not str(sbom.get('spdxVersion', '')).startswith('SPDX-'):
              raise SystemExit('Trivy did not emit SPDX JSON')
          if not sbom.get('packages'):
              raise SystemExit('Trivy emitted an empty SPDX package inventory')
          PYTHON

      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          # Kept out of the registry on purpose: cosign 3 discovers registry
          # bundles through referrers and rejects certificate-signed bundles
          # under a --key policy, which would break `cosign verify --key`.
          # Attestations remain in GitHub's store for `gh attestation verify`.
          push-to-registry: false

      - name: Attest SPDX SBOM with GitHub OIDC
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: doors.sbom.spdx.json
          push-to-registry: false

