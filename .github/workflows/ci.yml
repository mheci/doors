name: Policy and static validation

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    # Daily source/credential/policy drift check. This never publishes an image.
    - cron: '17 2 * * *'
  workflow_dispatch:

# Start from least privilege. Individual jobs only gain the permissions they use.
permissions:
  contents: read

concurrency:
  group: doors-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    permissions:
      actions: read # Enables zizmor's online inspection of pinned action dependencies.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions syntax
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Lint project shell scripts
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          # Custom BlueBuild modules execute at compose time and image payload
          # scripts execute on the built image, so lint both plus CI helpers.
          find modules files .github/scripts -type f -name '*.sh' -print0 \
            | sort -z \
            | xargs -0 -r shellcheck --shell=bash --severity=warning

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          persona: auditor
          online-audits: true

      - name: Scan committed history for credentials
        run: ./.github/scripts/scan-gitleaks.sh
