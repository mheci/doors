name: CodeQL

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # workflow graph inspection
      contents: read
      security-events: write # uploads findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none
          queries: +security-extended
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:actions
