name: CodeQL security analysis

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: doors-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Allows CodeQL to inspect the checked-in workflow graph.
      contents: read # Reads source without a persisted checkout credential.
      security-events: write # Uploads CodeQL findings to GitHub code scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL for GitHub Actions workflows
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: actions
          build-mode: none
          queries: +security-extended

      - name: Analyze GitHub Actions workflows
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:actions
