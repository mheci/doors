name: Build monthly Doors ISO

# The installer ISO is a monthly artifact. It is never rebuilt for pushes,
# pull requests, or image releases: only this schedule or a manual dispatch
# can start it. It always installs whatever ghcr.io/mheci/doors:latest was at
# build time, verified against the Doors signing key and its provenance.
on:
  schedule:
    # 1st of every month, 06:00 UTC (after the Sunday image rebuilds).
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doors-iso
  cancel-in-progress: false

env:
  SOURCE_IMAGE: ghcr.io/mheci/doors:latest
  ISO_PACKAGE: ghcr.io/mheci/doors-iso
  # GHCR accepts at most 10 GB per layer with a 10-minute upload window, and
  # the ISO embeds a ~10 GB container image. Ship it as fixed-size parts in one
  # OCI artifact; `cat` restores the original file byte-for-byte.
  PART_SIZE: 2G
  BOOTC_IMAGE_BUILDER: ghcr.io/osbuild/bootc-image-builder:v83.0.0@sha256:e7aadce6b3f5639cd47d83354791931ea219891a0d113c2fe74a0f0d352b165c

jobs:
  iso:
    name: iso (doors)
    if: github.repository == 'mheci/doors' && github.ref == 'refs/heads/main'
    # Same protected environment as image publication: it holds the Cosign key.
    environment: ghcr-publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # Pushes the signed ISO artifact to GHCR.
      id-token: write # Exchanges GitHub OIDC identity for the attestation issuer.
      attestations: write # Publishes provenance for the ISO artifact.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim hosted-runner disk for the installer build
        shell: bash
        run: |
          set -euo pipefail
          echo 'Disk usage before reclamation:'
          df -h /
          # Preinstalled toolchains that this job never uses. osbuild needs room
          # for the pulled image, its working tree, and the finished ISO.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/.ghcup /usr/share/swift /opt/microsoft
          docker system prune --all --force --volumes >/dev/null 2>&1 || true
          sudo apt-get clean
          echo 'Disk usage after reclamation:'
          df -h /

      - name: Name the artifact after the build month
        id: name
        shell: bash
        run: |
          set -euo pipefail
          month="$(date --utc +%Y-%m)"
          {
            printf 'month=%s\n' "${month}"
            printf 'iso=doors-gnome-%s.iso\n' "${month}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the source image and pin its digest
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Signature by the Doors key and GitHub provenance from this repo,
          # exactly the checks the README asks users to run before rebasing.
          cosign verify --key cosign.pub "${SOURCE_IMAGE}" > /dev/null
          gh attestation verify "oci://${SOURCE_IMAGE}" --owner mheci > /dev/null
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE_IMAGE}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "${SOURCE_IMAGE%%:*}" "${digest}" >> "$GITHUB_OUTPUT"
          printf 'Building installer from %s@%s\n' "${SOURCE_IMAGE}" "${digest}"

      - name: Build the Anaconda installer ISO
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          ISO_NAME: ${{ steps.name.outputs.iso }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/iso-output"
          # Root Podman is bootc-image-builder's containers-storage input; the
          # digest-pinned reference is what the ISO's kickstart will install.
          sudo podman pull --quiet "${SOURCE_REF}"
          sudo podman pull --quiet "${BOOTC_IMAGE_BUILDER}"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=disable \
            -v "${RUNNER_TEMP}/iso-output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BOOTC_IMAGE_BUILDER}" \
            build \
            --type anaconda-iso \
            --output /output \
            --chown "$(id -u):$(id -g)" \
            --progress verbose \
            "${SOURCE_REF}"
          test -s "${RUNNER_TEMP}/iso-output/bootiso/install.iso"
          sudo podman rmi --force "${SOURCE_REF}" >/dev/null 2>&1 || true

          mkdir -p "${RUNNER_TEMP}/artifact"
          mv "${RUNNER_TEMP}/iso-output/bootiso/install.iso" "${RUNNER_TEMP}/artifact/${ISO_NAME}"
          cd "${RUNNER_TEMP}/artifact"
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          split --bytes="${PART_SIZE}" --numeric-suffixes=1 --suffix-length=2 \
            "${ISO_NAME}" "${ISO_NAME}.part"
          rm -f "${ISO_NAME}"
          cat > REASSEMBLE.txt <<EOF
          cat ${ISO_NAME}.part* > ${ISO_NAME}
          sha256sum --check ${ISO_NAME}.sha256
          EOF
          ls -l
          df -h /

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Publish the ISO artifact to GHCR
        id: push
        shell: bash
        env:
          MONTH: ${{ steps.name.outputs.month }}
          ISO_NAME: ${{ steps.name.outputs.iso }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/artifact"
          printf '%s' "${REGISTRY_TOKEN}" \
            | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          files=( "${ISO_NAME}.sha256:text/plain" REASSEMBLE.txt:text/plain )
          for part in "${ISO_NAME}".part*; do
            files+=( "${part}:application/x-iso9660-image" )
          done
          oras push "${ISO_PACKAGE}:${MONTH}" \
            --artifact-type application/vnd.mheci.doors.iso.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/mheci/doors" \
            --annotation "org.opencontainers.image.description=Doors GNOME installer ISO ${MONTH} (split parts; see REASSEMBLE.txt)" \
            --annotation "io.mheci.doors.source-image=${SOURCE_REF}" \
            "${files[@]}"
          digest="$(oras resolve "${ISO_PACKAGE}:${MONTH}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          oras tag "${ISO_PACKAGE}:${MONTH}" latest
          printf 'digest=%s\n' "${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the ISO artifact with the Doors key
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          COSIGN_YES: 'true'
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --key env://COSIGN_PRIVATE_KEY "${ISO_PACKAGE}@${DIGEST}"
          cosign verify --key cosign.pub "${ISO_PACKAGE}@${DIGEST}" > /dev/null

      - name: Attest ISO provenance with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ISO_PACKAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Remove ephemeral registry credential
        if: always()
        shell: bash
        run: oras logout ghcr.io >/dev/null 2>&1 || true

      - name: Publish download instructions
        shell: bash
        env:
          MONTH: ${{ steps.name.outputs.month }}
          ISO_NAME: ${{ steps.name.outputs.iso }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
        run: |
          {
            echo "## ${ISO_NAME}"
            echo
            echo "- Artifact: \`${ISO_PACKAGE}:${MONTH}\` (\`${DIGEST}\`)"
            echo "- Installs: \`${SOURCE_REF}\`"
            echo
            echo '```bash'
            echo "cosign verify --key cosign.pub ${ISO_PACKAGE}:${MONTH}"
            echo "oras pull ${ISO_PACKAGE}:${MONTH}"
            echo "cat ${ISO_NAME}.part* > ${ISO_NAME} && sha256sum --check ${ISO_NAME}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
