name: Monthly Doors installer ISO

# The ISO is a monthly snapshot of the already published, signed GNOME image.
# It is never rebuilt for repository changes: only the schedule below or an
# explicit manual dispatch starts it. The file name carries the calendar
# month it was produced in (doors-YYYY-MM.iso).
on:
  schedule:
    # 06:00 UTC on the 1st, after that week's Sunday image build has settled.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month label for the artifact (YYYY-MM). Defaults to the current month.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: doors-iso
  cancel-in-progress: false

jobs:
  iso:
    name: Build and publish doors-<month>.iso
    if: github.repository == 'mheci/doors'
    # Same protected publication environment as the image publish jobs; it
    # holds the Cosign key and restricts publication to main.
    environment: ghcr-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write      # Pushes the ISO artifact to ghcr.io/mheci/doors-iso.
      attestations: write  # Publishes build provenance for the artifact digest.
      id-token: write      # Exchanges GitHub OIDC identity for the attestation issuer.
    env:
      SOURCE_IMAGE: ghcr.io/mheci/doors:latest
      ARTIFACT_REPOSITORY: ghcr.io/mheci/doors-iso
      BOOTC_IMAGE_BUILDER: ghcr.io/osbuild/bootc-image-builder:v83.0.0@sha256:e7aadce6b3f5639cd47d83354791931ea219891a0d113c2fe74a0f0d352b165c
      # GHCR rejects blobs above 10 GB and aborts uploads after 10 minutes, so
      # the ~11 GB ISO travels as fixed-size parts inside one OCI artifact.
      PART_SIZE: 2000M
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve month label
        id: month
        env:
          INPUT_MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          month="${INPUT_MONTH:-$(date --utc +%Y-%m)}"
          [[ "${month}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month must be YYYY-MM, got '${month}'" >&2; exit 1; }
          echo "label=${month}" >> "${GITHUB_OUTPUT}"
          echo "iso=doors-${month}.iso" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Fetched from the release download URL and checked against the published
      # checksums: no GitHub API lookups and no dependence on an action's
      # embedded version table.
      - name: Install checksum-verified ORAS
        env:
          # Renovate owns this release version.
          ORAS_VERSION: v1.3.4 # renovate: oras-release
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/oras-bin"
          mkdir -p "${dir}" && cd "${dir}"
          ver="${ORAS_VERSION#v}"
          base="https://github.com/oras-project/oras/releases/download/${ORAS_VERSION}"
          for f in "oras_${ver}_linux_amd64.tar.gz" "oras_${ver}_checksums.txt"; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 5 --retry-delay 10 --output "${f}" "${base}/${f}"
          done
          grep " oras_${ver}_linux_amd64.tar.gz\$" "oras_${ver}_checksums.txt" | sha256sum --check --status
          tar --extract --gzip --file "oras_${ver}_linux_amd64.tar.gz" oras
          rm -f "oras_${ver}_linux_amd64.tar.gz" "oras_${ver}_checksums.txt"
          echo "${dir}" >> "${GITHUB_PATH}"
          ./oras version

      # The hosted runner's root disk cannot hold the unpacked image, the
      # osbuild store, and the ISO at once. Root Podman storage moves to the
      # runner's larger secondary disk; the osbuild store and output stay on
      # the root disk after the preinstalled toolchains are removed.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          echo 'Disk before:'; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker system prune --all --force --volumes || true
          sudo podman system prune --all --force --volumes || true
          sudo apt-get clean
          sudo mkdir -p /mnt/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          mkdir -p "${RUNNER_TEMP}/osbuild-store" output
          echo 'Disk after:'; df -h / /mnt

      - name: Verify and pull the published GNOME image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The ISO embeds exactly the image a client would rebase to. Apply the
          # same checks the README asks users to run: the Doors release key and
          # GitHub build provenance from this repository.
          cosign verify --key cosign.pub "${SOURCE_IMAGE}" > /dev/null
          gh attestation verify "oci://${SOURCE_IMAGE}" --owner mheci > /dev/null
          sudo podman pull --quiet "${SOURCE_IMAGE}"
          digest="$(sudo podman image inspect "${SOURCE_IMAGE}" --format '{{.Digest}}')"
          echo "Source image digest: ${digest}" | tee -a "${GITHUB_STEP_SUMMARY}"
          df -h / /mnt

      # bootc-image-builder's stock anaconda-iso kickstart is unattended and
      # wipes the first disk. Supplying kickstart contents replaces it entirely:
      # only the embedded ostreecontainer line is added, and every remaining
      # decision (disk, encryption, user, locale) is made in Anaconda's UI.
      - name: Build the Anaconda installer ISO
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/iso-config.toml" <<'TOML'
          [customizations.installer.kickstart]
          contents = """
          graphical
          %post --erroronfail
          # Anaconda installs from the container embedded in the ISO. Point the
          # deployment back at the registry so the first weekly update resolves.
          bootc switch --mutate-in-place --transport registry ghcr.io/mheci/doors:latest
          %end
          """
          TOML
          # The installer environment is depsolved from the image's own
          # repositories, but bootc-image-builder resolves their file:// gpgkey
          # URLs against its own filesystem. Expose the image's pinned keys
          # (a superset of Fedora's) at the same path so verification holds.
          cid="$(sudo podman create --quiet "${SOURCE_IMAGE}" true)"
          sudo podman cp "${cid}:/etc/pki/rpm-gpg" "${RUNNER_TEMP}/rpm-gpg"
          sudo podman rm "${cid}" > /dev/null
          ls "${RUNNER_TEMP}/rpm-gpg"
          sudo podman pull --quiet "${BOOTC_IMAGE_BUILDER}"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=disable \
            -v "${PWD}/output:/output" \
            -v "${RUNNER_TEMP}/osbuild-store:/store" \
            -v "${RUNNER_TEMP}/iso-config.toml:/config.toml:ro" \
            -v "${RUNNER_TEMP}/rpm-gpg:/etc/pki/rpm-gpg:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BOOTC_IMAGE_BUILDER}" \
            build \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            --output /output \
            --config /config.toml \
            --chown "$(id -u):$(id -g)" \
            --progress verbose \
            "${SOURCE_IMAGE}"
          test -s output/bootiso/install.iso
          ls -l --block-size=M output/bootiso/install.iso
          # Free the osbuild store and the unpacked image before splitting.
          sudo rm -rf "${RUNNER_TEMP}/osbuild-store"
          sudo podman rmi --force "${SOURCE_IMAGE}" > /dev/null || true
          df -h / /mnt

      - name: Name, checksum, and split the ISO
        env:
          ISO: ${{ steps.month.outputs.iso }}
        run: |
          set -euo pipefail
          mkdir -p publish && cd publish
          mv ../output/bootiso/install.iso "${ISO}"
          sha256sum "${ISO}" | tee "${ISO}.sha256"
          ls -l --block-size=M "${ISO}"
          split --bytes="${PART_SIZE}" --numeric-suffixes=0 --suffix-length=2 "${ISO}" "${ISO}.part"
          rm -f "${ISO}"   # the parts are the artifact; the whole file is reassembled by the downloader
          sha256sum "${ISO}".part* > "${ISO}.parts.sha256"
          {
            echo "# ${ISO}"
            echo
            echo 'Download and reassemble:'
            echo
            echo '```bash'
            echo "oras pull ${ARTIFACT_REPOSITORY}:${ISO%.iso}"
            echo "cat ${ISO}.part* > ${ISO}"
            echo "sha256sum --check ${ISO}.sha256"
            echo '```'
          } > README.md
          ls -l

      - name: Push the ISO artifact to GHCR
        id: push
        env:
          ISO: ${{ steps.month.outputs.iso }}
          LABEL: ${{ steps.month.outputs.label }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish
          printf '%s' "${REGISTRY_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          files=( "${ISO}".part*:application/x-iso9660-image "${ISO}.sha256:text/plain" "${ISO}.parts.sha256:text/plain" README.md:text/markdown )
          oras push \
            --artifact-type application/vnd.doors.installer-iso.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=${LABEL}" \
            --annotation "org.opencontainers.image.title=${ISO}" \
            --annotation "org.opencontainers.image.description=Doors GNOME installer ISO for ${LABEL} (split parts; see README.md)" \
            --format go-template='{{.digest}}' \
            "${ARTIFACT_REPOSITORY}:${LABEL},latest" \
            "${files[@]}" | tee "${RUNNER_TEMP}/iso-digest.txt"
          echo "digest=$(cat "${RUNNER_TEMP}/iso-digest.txt")" >> "${GITHUB_OUTPUT}"

      - name: Sign the ISO artifact
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          COSIGN_YES: 'true'
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          cosign sign --key env://COSIGN_PRIVATE_KEY "${ARTIFACT_REPOSITORY}@${DIGEST}"
          cosign verify --key cosign.pub "${ARTIFACT_REPOSITORY}@${DIGEST}" > /dev/null

      - name: Attest ISO provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.ARTIFACT_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Not pushed to the registry: cosign 3 would surface this certificate
          # bundle through referrers and fail `cosign verify --key` on the ISO.
          push-to-registry: false

      - name: Summary
        env:
          ISO: ${{ steps.month.outputs.iso }}
          LABEL: ${{ steps.month.outputs.label }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## ${ISO}"
            echo
            echo "- artifact: \`${ARTIFACT_REPOSITORY}:${LABEL}\` (\`${DIGEST}\`)"
            echo "- source image: \`${SOURCE_IMAGE}\`"
            echo
            echo '```bash'
            echo "oras pull ${ARTIFACT_REPOSITORY}:${LABEL}"
            echo "cat ${ISO}.part* > ${ISO} && sha256sum --check ${ISO}.sha256"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
