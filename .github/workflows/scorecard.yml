name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: doors-scorecard-${{ github.ref || github.event.repository.default_branch }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      actions: read # Lets Scorecard inspect the repository's workflow hardening.
      contents: read # Reads the default-branch source without persisted credentials.
      id-token: write # Publishes verified Scorecard results for this repository.
      security-events: write # Uploads the Scorecard SARIF result to code scanning.
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
