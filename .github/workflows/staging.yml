name: Build weekly Doors staging image

on:
  schedule:
    # Weekly trusted-main candidate, one day ahead of the stable rebuild;
    # stable pushes never publish this tag.
    - cron: '20 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Trusted main matches build.yml and serializes stable/staging publication so
  # staging can prove it left doors:latest untouched. A non-main manual run
  # receives an isolated group and cannot delay trusted publication.
  group: >-
    ${{ github.repository == 'mheci/doors' && github.ref == 'refs/heads/main' &&
    'doors-trusted-publication' || format('doors-staging-untrusted-{0}', github.ref) }}
  # A staging run may have pushed its immutable candidate before attestation;
  # finish it rather than cancelling and leaving a partial release path.
  cancel-in-progress: false

jobs:
  image_publish:
    name: staging-image-publish
    # Limit Cosign and MOK private material to the protected main-only publication environment.
    environment: ghcr-publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write # Pushes the signed staging OCI image to its existing GHCR package.
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # BlueBuild alt-tags override generated latest/timestamp tags. Record the
      # stable digest before compose and prove below that staging changed only
      # the approved staging tag under the shared trusted-publication lock.
      - name: Record stable latest digest before staging build
        env:
          IMAGE: ghcr.io/mheci/doors
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          latest_digest="$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${latest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "STABLE_LATEST_DIGEST=${latest_digest}" >> "$GITHUB_ENV"
          docker logout ghcr.io

      - name: Build, sign, and publish ghcr.io/mheci/doors:staging
        id: publish_build
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          # ghcr-publish is main-only; BlueBuild exposes this only to the late
          # signing RUN through a BuildKit secret mount.
          DOORS_MOK_SIGNING_KEY: ${{ secrets.DOORS_MOK_SIGNING_KEY }}
        with:
          recipe: doors-staging.yml
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          maximize_build_space: true
          skip_checkout: true

      - name: Wait for upstream package metadata convergence
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 300

      - name: Reset SLSA verifier cache before retry
        if: steps.publish_build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf -- "${HOME}/.slsa"

      - name: Retry signed staging publication once
        id: publish_build_retry
        if: steps.publish_build.outcome == 'failure'
        continue-on-error: true
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        env:
          # ghcr-publish is main-only; BlueBuild exposes this only to the late
          # signing RUN through a BuildKit secret mount.
          DOORS_MOK_SIGNING_KEY: ${{ secrets.DOORS_MOK_SIGNING_KEY }}
        with:
          recipe: doors-staging.yml
          cli_version: v0.9.37
          verify_install: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          registry_namespace: mheci
          push: true
          maximize_build_space: true
          skip_checkout: true

      - name: Fail closed if retry did not recover
        if: always() && steps.publish_build.outcome == 'failure' && steps.publish_build_retry.outcome != 'success'
        shell: bash
        run: |
          echo 'The staging publication build still failed after the bounded upstream-convergence retry.' >&2
          exit 1

      - name: Resolve immutable staging digest
        env:
          IMAGE: ghcr.io/mheci/doors
          TAG: staging
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          latest_after="$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${latest_after}" == "${STABLE_LATEST_DIGEST}" ]] || {
            echo 'staging compose unexpectedly changed ghcr.io/mheci/doors:latest' >&2
            exit 1
          }
          jq -n --arg name "${IMAGE}" --arg tag "${TAG}" --arg digest "${digest}" \
            '{name: $name, tag: $tag, digest: $digest}' > image.json
          docker logout ghcr.io

      - name: Hand off immutable staging identity to fresh-runner release checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doors-published-staging
          path: image.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: staging-publish
    needs: image_publish
    if: needs.image_publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write # Publishes staging provenance and SBOM attestations.
      contents: read
      id-token: write # Exchanges GitHub OIDC identity for the attestation issuer.
      packages: write # Reads the staged image and pushes its registry attestations.
    steps:
      - name: Download immutable staging identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: doors-published-staging
          path: identity

      - name: Validate immutable staging identity
        shell: bash
        run: |
          set -euo pipefail
          test -f identity/image.json
          name="$(jq -er '.name' identity/image.json)"
          tag="$(jq -er '.tag' identity/image.json)"
          digest="$(jq -er '.digest' identity/image.json)"
          [[ "${name}" == 'ghcr.io/mheci/doors' ]]
          [[ "${tag}" == 'staging' ]]
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "IMAGE=${name}"
            echo "DIGEST=${digest}"
          } >> "$GITHUB_ENV"

      # Pulled straight from the release download URL and checked against the
      # published checksums, so this step never touches the rate-limited
      # GitHub API from a shared runner address.
      - name: Install checksum-verified Trivy
        shell: bash
        env:
          # Renovate owns this release version.
          TRIVY_VERSION: v0.74.0 # renovate: trivy-release
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${dir}" && cd "${dir}"
          ver="${TRIVY_VERSION#v}"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          for f in "trivy_${ver}_Linux-64bit.tar.gz" "trivy_${ver}_checksums.txt"; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --retry 5 --retry-delay 10 --output "${f}" "${base}/${f}"
          done
          grep " trivy_${ver}_Linux-64bit.tar.gz\$" "trivy_${ver}_checksums.txt" | sha256sum --check --status
          tar --extract --gzip --file "trivy_${ver}_Linux-64bit.tar.gz" trivy
          rm -f "trivy_${ver}_Linux-64bit.tar.gz" "trivy_${ver}_checksums.txt"
          echo "${dir}" >> "${GITHUB_PATH}"
          ./trivy --version

      - name: Generate SPDX SBOM for immutable staging digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/trivy-registry-config"
          export TRIVY_CACHE_DIR="${RUNNER_TEMP}/trivy-cache"
          trap 'rm -rf -- "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"' EXIT
          mkdir -p "${DOCKER_CONFIG}" "${TRIVY_CACHE_DIR}"
          printf '%s' "${REGISTRY_TOKEN}" | trivy registry login \
            --username "${GITHUB_ACTOR}" --password-stdin ghcr.io
          trivy image --quiet --parallel 1 --timeout 45m --format spdx-json \
            --output doors.sbom.spdx.json "${IMAGE}@${DIGEST}"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          sbom = json.loads(Path('doors.sbom.spdx.json').read_text(encoding='utf-8'))
          if not str(sbom.get('spdxVersion', '')).startswith('SPDX-'):
              raise SystemExit('Trivy did not emit SPDX JSON')
          if not sbom.get('packages'):
              raise SystemExit('Trivy emitted an empty SPDX package inventory')
          PYTHON

      - name: Authenticate GHCR for registry attestations
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Attest build provenance with GitHub OIDC
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SPDX SBOM with GitHub OIDC
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: doors.sbom.spdx.json
          push-to-registry: true

      - name: Remove ephemeral GHCR attestation credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
