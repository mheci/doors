# Doors — Plasma Login Manager drop-in
# Installed to /usr/share/plasma/plasmalogin.conf.d/10-doors.conf

[Theme]
Theme=org.kde.breezedark
ColorScheme=Doors
Font=Inter,10,-1,5,50,0,0,0,0,0,Regular
CursorTheme=Bibata-Modern-Ice,CursorSize=24
Wallpaper=/usr/share/wallpapers/doors/contents/images/doors.svg

[General]
Numlock=on
WaylandEnable=true
