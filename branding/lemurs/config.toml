# Doors — lemurs login theme (full config; lemurs requires all options present)
# Installed to /etc/lemurs/config.toml
# Colors: hex codes supported. Doors palette: base #171216, surface #1f171b,
# border #3a2d33, text #f2ecea, muted #b9a9ac, rose #f4acb7.

tty = 2
main_log_path = "/var/log/lemurs.log"
client_log_path = "/var/log/lemurs.client.log"
cache_path = "/var/cache/lemurs"
do_log = true
pam_service = "lemurs"
system_shell = "/bin/sh"
initial_path = "/usr/local/sbin:/usr/local/bin:/usr/bin"
shell_login_flag = "short"
focus_behaviour = "default"

[background]
show_background = true

[background.style]
color = "#171216"
show_border = true
border_color = "#3a2d33"

[power_controls]
hint_margin = 2
entries = []

[[power_controls.base_entries]]
hint = "Shutdown"
hint_color = "#b9a9ac"
hint_modifiers = ""
key = "F1"
cmd = "systemctl poweroff -l"

[[power_controls.base_entries]]
hint = "Reboot"
hint_color = "#b9a9ac"
hint_modifiers = ""
key = "F2"
cmd = "systemctl reboot -l"

[environment_switcher]
switcher_visibility = "visible"
toggle_hint = "Switcher %key%"
toggle_hint_color = "#b9a9ac"
toggle_hint_modifiers = ""
include_tty_shell = false
remember = true
show_movers = true
mover_color = "#b9a9ac"
mover_modifiers = ""
mover_color_focused = "#f4acb7"
mover_modifiers_focused = "bold"
left_mover = "<"
right_mover = ">"
mover_margin = 1
show_neighbours = true
neighbour_color = "#b9a9ac"
neighbour_modifiers = ""
neighbour_color_focused = "#f2ecea"
neighbour_modifiers_focused = ""
neighbour_margin = 1
selected_color = "#f2ecea"
selected_modifiers = "underlined"
selected_color_focused = "#f4acb7"
selected_modifiers_focused = "bold"
max_display_length = 8
no_envs_text = "No environments..."
no_envs_color = "#f2ecea"
no_envs_modifiers = ""
no_envs_color_focused = "#f4acb7"
no_envs_modifiers_focused = ""

[username_field]
remember = true

[username_field.style]
show_title = true
title = "Login"
title_color = "#f2ecea"
content_color = "#f2ecea"
title_color_focused = "#f4acb7"
content_color_focused = "#f4acb7"
show_border = true
border_color = "#3a2d33"
border_color_focused = "#f4acb7"
use_max_width = true
max_width = 48

[password_field]
content_replacement_character = "*"

[password_field.style]
show_title = true
title = "Password"
title_color = "#f2ecea"
content_color = "#f2ecea"
title_color_focused = "#f4acb7"
content_color_focused = "#f4acb7"
show_border = true
border_color = "#3a2d33"
border_color_focused = "#f4acb7"
use_max_width = true
max_width = 48

[x11]
xserver_log_path = "/var/log/lemurs.xorg.log"
x11_display = ":1"
xserver_timeout_secs = 60
xserver_path = "/usr/bin/X"
xauth_path = "/usr/bin/xauth"
scripts_path = "/etc/lemurs/wms"
xsetup_path = "/etc/lemurs/xsetup.sh"
xsessions_path = "/usr/share/xsessions"

[wayland]
scripts_path = "/etc/lemurs/wayland"
wayland_sessions_path = "/usr/share/wayland-sessions"
