# Doors-managed Network Time Security policy.
# Only explicitly reviewed NTS-capable sources are permitted. Do not add a pool,
# DHCP sourcedir, or unauthenticated server line without deliberately changing
# the authentication policy below.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts

# Require two authenticated, selectable sources before adjusting the clock.
minsources 2
authselectmode require

# Persist clock drift and NTS cookies across service restarts.
driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
leapsectz right/UTC

# Permit initial correction, then keep the RTC synchronized.
makestep 1.0 3
rtcsync

# chronyc still has its local Unix socket; do not expose an unauthenticated UDP
# monitoring endpoint or serve time to the network.
cmdport 0
