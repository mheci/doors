[main]
# The image owns one kernel. These names are the Fedora stock packages and the
# CachyOS variants this image does not ship. kernel-cachyos* desktop packages
# are not matched by these exact names.
#
# kernel-headers stays available. It is the userspace UAPI package required by
# glibc-devel, GCC, and the CUDA toolkit. It is not the running kernel.
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-devel,kernel-devel-matched,kernel-cachyos-lts,kernel-cachyos-lts-core,kernel-cachyos-lts-devel,kernel-cachyos-lts-devel-matched,kernel-cachyos-lts-modules,kernel-cachyos-lts-nvidia-open,kernel-cachyos-rt,kernel-cachyos-rt-core,kernel-cachyos-rt-devel,kernel-cachyos-rt-devel-matched,kernel-cachyos-rt-modules,kernel-cachyos-rt-nvidia-open,kernel-cachyos-server,kernel-cachyos-server-core,kernel-cachyos-server-devel,kernel-cachyos-server-devel-matched,kernel-cachyos-server-modules,kernel-cachyos-server-nvidia-open,kernel-cachyos-nvidia-open
