# PulseAudio clients include every Proton/Wine title and most browsers and
# media players. Track the 1024-frame graph baseline so Pulse buffers are
# never smaller than the graph quantum (the classic source of game crackle),
# while letting a well-behaved low-latency client request down to 256.
pulse.properties = {
    pulse.min.req = 256/48000
    pulse.default.req = 1024/48000
    pulse.min.frag = 256/48000
    pulse.default.frag = 1024/48000
    pulse.default.tlength = 2048/48000
    pulse.min.quantum = 256/48000
}
