# PulseAudio clients include Proton/Wine titles. Keep their default request at
# the shared 256-frame baseline while allowing well-behaved low-latency clients
# to negotiate down to 64 frames rather than forcing an unsafe global quantum.
pulse.properties = {
    pulse.min.req = 128/48000
    pulse.default.req = 256/48000
    pulse.min.frag = 128/48000
    pulse.default.frag = 256/48000
    pulse.default.tlength = 1024/48000
    pulse.min.quantum = 64/48000
}
