# Doors' shared high-quality, low-latency audio baseline. User-level drop-ins
# may still override these defaults for specialist recording workflows.
context.properties = {
    # Do not load PipeWire's X11 alert-bell module.
    module.x11.bell = false

    # 48 kHz is the common native rate for games, Proton/Wine, HDMI, and most
    # USB audio hardware. 256 frames is a conservative 5.33 ms baseline.
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 64
    default.clock.max-quantum = 1024
    default.clock.quantum-limit = 2048
}

stream.properties = {
    # Prefer a high-quality resampler when a client/device does need conversion.
    resample.quality = 10
}
