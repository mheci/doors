# Doors shared audio baseline: stability first.
#
# Crackling is almost always an xrun: the graph could not fill the device
# buffer in time because a game, shader compiler, or browser stole the CPU at
# the wrong moment. A 1024-frame quantum at 48 kHz (21.3 ms) gives the graph
# headroom that survives those spikes on every class of device seen in the
# field, while still being well below the ~40 ms where lip-sync becomes
# noticeable. Clients that genuinely need lower latency (rhythm games, DAWs)
# can still negotiate down to 256 frames; nothing may push the graph past
# 4096. User drop-ins under ~/.config/pipewire override any of this.
context.properties = {
    # Do not load PipeWire's X11 alert-bell module.
    module.x11.bell = false

    # 48 kHz is the native rate for games, Proton/Wine, HDMI, and USB audio.
    # A single allowed rate avoids device rate switches (an audible pop) when
    # a 44.1 kHz stream starts; those streams are resampled instead.
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 1024
    default.clock.min-quantum = 256
    default.clock.max-quantum = 4096
    default.clock.quantum-limit = 8192
}

stream.properties = {
    # High-quality resampler for the 44.1 kHz media that does need conversion.
    resample.quality = 10
}
