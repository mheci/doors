# System-wide PipeWire virtual microphone backed by the locally built,
# GPL-3.0 Anechoic LADSPA plugin. It is passive: applications opt in by
# selecting "Anechoic Noise Suppression" as their input source.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Anechoic Noise Suppression"
            media.name = "Anechoic Noise Suppression"

            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = anechoic_suppressor
                        plugin = ladspa/libanechoic_ladspa
                        label = noise_suppressor_mono

                        control = {
                            "VAD Threshold (%)" = 55
                            "VAD Grace Period (ms)" = 200
                            "VAD Hysteresis (%)" = 0
                            "Comfort Noise Floor (dB)" = -40
                        }
                    }
                ]
            }

            capture.props = {
                node.name = "capture.anechoic_suppressor"
                node.passive = true
                media.class = "Audio/Sink"
            }
            playback.props = {
                node.name = "playback.anechoic_suppressor"
                node.passive = true
                media.class = "Audio/Source"
            }
            audio.rate = 48000
            audio.position = [ FL ]
            capture.rate = 48000
        }
    }
]
