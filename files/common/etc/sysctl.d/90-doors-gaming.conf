# Doors gaming latency policy.
#
# vm.max_map_count is raised to 2147483642 (INT_MAX - 5), the maximum value the
# kernel accepts, so a single Wine/Proton process can never hit the VMA ceiling
# during a large game load. Be aware this effectively removes the per-process
# mapping cap: a runaway or hostile process can then allocate VMAs until kernel
# memory is exhausted, because each mapping costs kernel-side tracking memory.
#
# split_lock_mitigate=0 removes intentional split-lock throttling, at the cost
# of less resilience against a local split-lock denial of service.
vm.max_map_count = 2147483642
vm.page_lock_unfairness = 1
kernel.split_lock_mitigate = 0
