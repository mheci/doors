# Doors systemd-oomd policy for 32 GiB+ desktops.
#
# Fedora's defaults (60% pressure for 20 s, swap kill at 90%) were tuned for
# small-memory hosts. On a large-memory gaming/AI workstation, shader
# compilation, texture streaming, and model loading produce short, intense
# memory-pressure spikes while plenty of RAM is still free; killing the game
# or agent for that is a false positive. Require sustained, severe pressure
# and a nearly exhausted swap device before oomd acts.
[OOM]
SwapUsedLimit=95%
DefaultMemoryPressureLimit=80%
DefaultMemoryPressureDurationSec=45s
