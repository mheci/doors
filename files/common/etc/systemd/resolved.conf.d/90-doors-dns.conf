# Managed by Doors DNS selector: systemd-resolved-compat
# Opportunistic DNS-over-TLS with downgrade-tolerant DNSSEC. This preserves
# network compatibility; strict Quad9/Cloudflare and local Unbound modes are
# selected explicitly and are never imposed as a first-boot default.
[Resolve]
DNS=
FallbackDNS=
Domains=
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
