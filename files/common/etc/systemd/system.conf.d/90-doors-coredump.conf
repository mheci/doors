# Keep all system services from requesting core files.
# cachyos-settings raises the hard NOFILE limit to 2097152. polkit and upower
# close descriptors up to that limit and miss their start timeout, which fails
# the serial boot gate. Stay at systemd's high default. The KVM-less gate still
# needs a longer start timeout: the first boot also refreshes the appstream and
# mandb caches while those daemons claim their bus names.
[Manager]
DefaultLimitCORE=0
DefaultLimitNOFILE=1024:524288
DefaultTimeoutStartSec=300
DefaultTimeoutStopSec=90
