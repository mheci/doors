# System-scope Flatpaks (Bazaar, Gear Lever, anything installed --system)
# follow the same hourly cadence as per-user tooling. Timer clauses are
# additive, so upstream's schedule is cleared before the hourly one is set.
[Timer]
OnActiveSec=
OnBootSec=
OnUnitActiveSec=
OnCalendar=
OnBootSec=10min
OnUnitActiveSec=1h
RandomizedDelaySec=10min
Persistent=false
