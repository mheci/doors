# greenboot-rs currently persists its boot-success state through GRUB's
# grubenv. Skip, rather than fail, on a future non-GRUB deployment.
# The required check calls rpm-ostree status. On Kinoite that client can sit
# in the start job until the daemon is up, and the unit has no start limit.
[Unit]
ConditionPathExists=/boot/grub2/grubenv
After=rpm-ostreed.service
Wants=rpm-ostreed.service
TimeoutStartSec=180
