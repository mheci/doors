# Lavd's BPF verifier stalls a KVM-less boot if it runs beside the D-Bus
# daemons. Start only after those daemons and Greenboot are up, and allow the
# verifier enough time to finish.
[Unit]
After=greenboot-healthcheck.service polkit.service upower.service avahi-daemon.service rtkit-daemon.service systemd-homed.service accounts-daemon.service udisks2.service switcheroo-control.service

[Service]
TimeoutStartSec=300
