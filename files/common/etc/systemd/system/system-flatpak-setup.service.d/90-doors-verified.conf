# default-flatpaks v2 adds the Flathub remote but has no notion of Flathub
# subsets. Constrain the system remote to the "verified" subset before the
# module installs anything, so only apps verified by their upstream developer
# are installable or updatable from it. Both Doors defaults (Bazaar, Gear
# Lever) are verified. Reverse with: flatpak remote-modify --system --subset= flathub
[Service]
ExecStartPre=-/usr/bin/flatpak remote-add --system --if-not-exists --subset=verified flathub https://dl.flathub.org/repo/flathub.flatpakrepo
ExecStartPre=/usr/bin/flatpak remote-modify --system --subset=verified flathub
