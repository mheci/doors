# The first upower start can exit while udev is still publishing power
# devices. Drain that queue, then give the daemon time to claim its bus name.
# A non-zero settle does not fail the unit; systemd still restarts a failed
# start, and the boot gate requires the daemon to reach started.
[Unit]
After=systemd-udev-trigger.service polkit.service
Wants=polkit.service

[Service]
ExecStartPre=-/usr/bin/udevadm settle --timeout=30
TimeoutStartSec=180
