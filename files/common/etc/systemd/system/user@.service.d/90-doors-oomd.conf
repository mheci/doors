# Fedora enables pressure-based oomd killing for every user slice at 50%.
# Apply the Doors large-memory thresholds to user sessions as well so
# foreground applications are only killed under sustained, severe pressure.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
ManagedOOMMemoryPressureDurationSec=45s
