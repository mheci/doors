# Same verified-only policy for the per-user Flathub remote that
# default-flatpaks v2 creates. Reverse with: flatpak remote-modify --user --subset= flathub
[Service]
ExecStartPre=-/usr/bin/flatpak remote-add --user --if-not-exists --subset=verified flathub https://dl.flathub.org/repo/flathub.flatpakrepo
ExecStartPre=/usr/bin/flatpak remote-modify --user --subset=verified flathub
