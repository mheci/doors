# Managed by Doors DNS selector. The image defaults to native resolved DoT;
# this local validating resolver is activated only by an unbound-* mode.
server:
    interface: 127.0.0.1
    interface: ::1
    port: 5335
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    do-daemonize: no
    username: "unbound"
    directory: "/etc/unbound"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    module-config: "validator iterator"
    val-permissive-mode: no
    harden-dnssec-stripped: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    prefetch: yes
    hide-identity: yes
    hide-version: yes
    tls-cert-bundle: "/etc/pki/tls/certs/ca-bundle.crt"

# The selector replaces these placeholder forwarders with one reviewed provider
# before it starts unbound. Keeping the service disabled in native modes avoids
# accidental recursive listener activation.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
