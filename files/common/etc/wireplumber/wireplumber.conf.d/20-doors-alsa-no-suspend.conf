# Keep ALSA nodes available between streams. This avoids wake-up latency and
# prevents common NVIDIA HDMI/DisplayPort suspend-pop/crackle behavior without
# guessing at hardware-specific PCI property names.
monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_.*"
            }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
