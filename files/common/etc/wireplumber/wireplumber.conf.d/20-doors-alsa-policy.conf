# Doors ALSA device policy: never suspend, never let a DAC power-cycle.
#
# Pops and clicks come from state transitions: a codec or HDMI/DP receiver
# waking from suspend, a DAC un-muting for the first stream, or a sample-rate
# renegotiation. Every rule here removes a transition rather than masking it.
monitor.alsa.rules = [
    # 1. All ALSA nodes: no idle suspend (WirePlumber's default is 5 s, which is
    #    exactly the "pop a few seconds after playback stops" symptom).
    {
        matches = [ { node.name = "~alsa_.*" } ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }

    # 2. All outputs: keep the graph processing even with no client so the DAC
    #    never sees the digital-silence gap that makes many amplifiers and
    #    monitors click on the first sample. Inputs are excluded on purpose:
    #    an always-running microphone node costs power and looks like a hot mic.
    {
        matches = [ { node.name = "~alsa_output.*" } ]
        actions = {
            update-props = {
                node.always-process = true
                # Extra device-buffer headroom on top of the graph quantum.
                # 512 frames (10.7 ms) absorbs the IRQ jitter of on-board and
                # PCI codecs without pushing latency past the baseline.
                api.alsa.headroom = 512
            }
        }
    }

    # 3. USB audio: batch-mode devices deliver data in bursts and are the
    #    single largest source of xrun crackle; give them a full extra period.
    {
        matches = [
            { node.name = "~alsa_output.usb-.*" }
            { node.name = "~alsa_input.usb-.*" }
        ]
        actions = {
            update-props = {
                api.alsa.headroom = 1024
                api.alsa.period-size = 1024
            }
        }
    }

    # 4. NVIDIA (and any) HDMI/DisplayPort output: the receiver on the other end
    #    of the cable drops and re-acquires the audio stream on silence, which
    #    is the 1-5 s "audio takes a moment to start" delay and the pop when it
    #    does. Low-level dither keeps the link carrying a signal continuously.
    {
        matches = [ { node.name = "~alsa_output.pci-.*hdmi.*" } ]
        actions = {
            update-props = {
                dither.method = "wannamaker3"
                dither.noise = 1
            }
        }
    }
]
