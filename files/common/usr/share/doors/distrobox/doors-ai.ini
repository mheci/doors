[doors-ai]
# Arch Linux tracks its signed official repositories; the bootstrap performs a
# full pacman refresh in one transaction before it installs the AI toolchain.
image=docker.io/library/archlinux:latest
pull=true
# Every Doors-managed Distrobox is NVIDIA-enabled, initful, and started as part
# of declarative user startup. Distrobox turns init=true into Podman's systemd
# mode and isolates the container PID namespace by design.
nvidia=true
init=true
root=false
replace=false
start_now=true
entry=false
volume="/usr/share/doors/distrobox:/opt/doors:ro"
# Arch requires systemd in the container for Distrobox init=true.
additional_packages="ca-certificates coreutils curl findutils gawk gnupg grep jq sudo systemd unzip"
init_hooks="/usr/bin/bash /opt/doors/bootstrap-ai.sh"
