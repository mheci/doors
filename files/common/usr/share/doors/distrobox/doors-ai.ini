[doors-ai]
# Arch Linux tracks its signed official repositories; the bootstrap performs a
# full pacman refresh in one transaction before it installs the AI toolchain.
image=docker.io/library/archlinux:latest
pull=true
nvidia=true
init=false
root=false
replace=false
start_now=true
entry=false
volume="/usr/share/doors/distrobox:/opt/doors:ro"
additional_packages="ca-certificates coreutils curl findutils gawk gnupg grep jq sudo unzip"
init_hooks="/usr/bin/bash /opt/doors/bootstrap-ai.sh"
