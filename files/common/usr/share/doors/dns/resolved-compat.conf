# Managed by Doors DNS selector: systemd-resolved-compat
# This intentionally permits NetworkManager per-link DNS for DHCP and VPN
# compatibility. It does not provide the strict upstream control of Doors DoT
# or local Unbound modes.
[Resolve]
DNS=
FallbackDNS=
Domains=
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
