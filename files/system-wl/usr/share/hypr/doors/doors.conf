# Doors — Hyprland defaults (sourced by user configs via `source`)
# Branding kit: /home/user/doors-branding/hyprland/doors-colors.conf (shipped here)

source = /usr/share/hypr/doors/doors-colors.conf

general {
    gaps_in        = 5
    gaps_out       = 10
    border_size    = 2
    layout         = dwindle
    allow_tearing  = true
}

input {
    kb_layout       = us
    follow_mouse    = 1
    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

decoration {
    rounding = 8
    active_opacity   = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size    = 6
        passes  = 2
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier  = easeOutCubic, 0.22, 0.61, 0.36, 1
    animation = windows,    1, 4, easeOutCubic, popin 80%
    animation = workspaces, 1, 4, easeOutCubic, slidefade
}

# Doors keybinds
$mainMod = SUPER
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, pcmanfm-qt
bind = $mainMod, Space, exec, fuzzel
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, S, togglespecialworkspace,
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# exec helpers
exec-once = hyprpaper
exec-once = waybar
exec-once = cliphist wipe
exec-once = dunst
