# Doors — falcond (game-detection performance daemon)
# For a full key reference see https://github.com/PikaOS-Linux/falcond
# Defaults below mirror falcond's shipped defaults; the scheduler (scx_lavd)
# is owned by scx_loader via /etc/scx_loader/config.toml.

[general]
enabled = true

[scx]
scx_sched = "lavd"
scx_sched_props = "gaming"
