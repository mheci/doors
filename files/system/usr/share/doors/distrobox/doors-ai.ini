[doors-ai]
# Fedora 44 is deliberate: do not track the mutable Fedora latest tag.
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
nvidia=true
init=false
root=false
replace=false
start_now=true
entry=false
volume="/usr/share/doors/distrobox:/opt/doors:ro"
additional_packages="ca-certificates coreutils curl findutils gawk gnupg2 grep jq sudo unzip"
init_hooks="/usr/bin/bash /opt/doors/bootstrap-ai.sh"
