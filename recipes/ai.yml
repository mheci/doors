---
# Shared: AI runtime — llama.cpp (stage-built per backend), pi, opencode, t3code.
modules:
  # llama.cpp binaries, built in the `llama` stage for this image's backend (CUDA / HIP)
  - type: copy
    from: llama
    src: /out/bin
    dest: /usr/bin

  # Node + npm (pi), t3code (Terra)
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - nodejs
        - npm
        - t3code

  # pi — pinned, Renovate-managed
  - type: script
    snippets:
      - 'npm install -g --prefix /usr/local @earendil-works/pi-coding-agent@0.85.1'

  # opencode — pinned installer, Renovate-managed
  - type: script
    scripts:
      - install-opencode.sh
