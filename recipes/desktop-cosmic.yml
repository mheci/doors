---
# COSMIC desktop module. The Fedora cosmic-atomic base ships the desktop,
# so this only layers the GTK portal for flatpaks and the Doors session script.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - xdg-desktop-portal-gtk

  # lemurs replaces the COSMIC greeter (decision D9)
  - type: systemd
    system:
      masked:
        - cosmic-greeter.service
        - cosmic-greeter-daemon.service

  - type: files
    files:
      - source: system-cosmic
        destination: /
