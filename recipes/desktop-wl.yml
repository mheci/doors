---
# Hyprland desktop module
modules:
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        - hyprland
        - hyprlock
        - hypridle
        - hyprpaper
        - hyprcursor
        - hyprpicker
        - hyprsunset
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk

  # Hyprland-specific files (lemurs hyprland session + doors defaults)
  - type: files
    files:
      - source: system-wl
        destination: /
