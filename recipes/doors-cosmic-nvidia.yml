---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: doors-cosmic-nvidia
description: "Doors — COSMIC gaming image (NVIDIA Turing+, nvidia-open, Terra driver + CUDA)"
# Fedora-official COSMIC bootc image (ublue cosmic-atomic-main is deprecated at F42)
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44
alt-tags:
  - "44"
  - latest

stages:
  - name: kmods
    from: ghcr.io/ublue-os/base-main:44
    modules:
      - type: script
        scripts:
          - build-kmods-nvidia.sh
  - name: llama
    from: ghcr.io/ublue-os/base-main:44
    modules:
      - type: script
        env:
          LLAMA_BACKEND: cuda
        scripts:
          - build-llama-cpp.sh

modules:
  - from-file: repos.yml
  - from-file: kernel.yml
  - from-file: gpu-nvidia.yml
  - from-file: packages.yml
  - from-file: desktop-cosmic.yml
  - from-file: ai.yml
  - from-file: branding.yml
