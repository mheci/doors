---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: doors-cosmic
description: "Doors — COSMIC gaming image (universal: Intel + AMD, Terra Mesa)"
# Fedora-official COSMIC bootc image (ublue cosmic-atomic-main is deprecated at F42)
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44
alt-tags:
  - "44"
  - latest

stages:
  - name: llama
    from: ghcr.io/ublue-os/base-main:44
    modules:
      - type: script
        env:
          LLAMA_BACKEND: hip
        scripts:
          - build-llama-cpp.sh

modules:
  - from-file: repos.yml
  - from-file: kernel.yml
  - from-file: gpu-universal.yml
  - from-file: packages.yml
  - from-file: steam.yml
  - from-file: desktop-cosmic.yml
  - from-file: ai.yml
  - from-file: branding.yml
