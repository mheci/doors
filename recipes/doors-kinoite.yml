---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: doors-kinoite
description: "Doors Kinoite — signed Fedora Kinoite 44 NVIDIA Open image"
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 44
blue-build-tag: none
alt-tags:
  - latest
platforms:
  - linux/amd64
labels:
  org.opencontainers.image.source: "https://github.com/mheci/doors"
  org.opencontainers.image.licenses: "Apache-2.0"

stages:
  - name: doors-tools-build
    from: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open:44
    modules:
      - type: script
        scripts:
          - build-wl-clip-persist.sh
          - build-anechoic.sh

modules:
  - from-file: modules/common.yml
  - from-file: modules/kinoite.yml
  - from-file: modules/secureboot.yml
  # BlueBuild installs the per-image Cosign policy first. Extend it only with
  # the fixed sibling Doors repositories that share this protected production key.
  - type: signing
  - type: script
    scripts:
      - configure-doors-signature-policy.sh
