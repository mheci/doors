---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: doors-kinoite
description: "Doors Kinoite — signed Fedora Kinoite 44 NVIDIA Open image"
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: 44
blue-build-tag: none
alt-tags:
  - latest
platforms:
  - linux/amd64
labels:
  org.opencontainers.image.source: "https://github.com/mheci/doors"
  org.opencontainers.image.licenses: "Apache-2.0"

# A disposable Fedora 44 stage builds reviewed third-party tools without
# carrying their Cargo/CMake toolchains into the bootable image.
stages:
  - name: doors-tools-build
    from: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open:44
    modules:
      - type: wl-clip-persist
        source: local
      - type: anechoic
        source: local

modules:
  - from-file: modules/common.yml
  - from-file: modules/kinoite.yml
  # Late MOK signing runs only with protected key material on trusted
  # publication events; candidate builds use disposable keys.
  - from-file: modules/secureboot.yml
  # Install bootc/rpm-ostree Cosign policy. CI supplies SIGNING_SECRET only on
  # trusted publication events.
  - type: signing
  # BlueBuild installs the per-image Cosign policy first. Extend it only with
  # the fixed sibling Doors repositories that share this protected key.
  - type: signature-policy
    source: local
