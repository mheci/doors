---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
# Keep the daily candidate in the existing doors package: ghcr.io/mheci/doors:staging.
name: doors
description: "Doors staging — daily Fedora Silverblue 44 NVIDIA Open candidate"
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 44
blue-build-tag: none
# BlueBuild alt-tags replace generated automatic tags. This image can update
# only the approved staging tag, never the stable tag.
alt-tags:
  - staging
platforms:
  - linux/amd64
labels:
  org.opencontainers.image.source: "https://github.com/mheci/doors"
  org.opencontainers.image.licenses: "Apache-2.0"

stages:
  - name: doors-tools-build
    from: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open:44
    modules:
      - type: script
        scripts:
          - build-wl-clip-persist.sh
          - build-anechoic.sh

modules:
  - from-file: modules/common.yml
  - from-file: modules/gnome.yml
  - from-file: modules/secureboot.yml
  - type: signing
