---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: doors-wl
description: "Doors — Hyprland gaming image (universal: Intel + AMD, Terra Mesa)"
base-image: ghcr.io/ublue-os/base-main
image-version: 44
alt-tags:
  - "44"
  - latest

stages:
  - name: llama
    from: ghcr.io/ublue-os/base-main:44
    modules:
      - type: script
        env:
          LLAMA_BACKEND: hip
        scripts:
          - build-llama-cpp.sh

modules:
  - from-file: repos.yml
  - from-file: kernel.yml
  - from-file: gpu-universal.yml
  - from-file: packages.yml
  - from-file: desktop-wl.yml
  - from-file: ai.yml
  - from-file: branding.yml
