---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: doors
description: "Doors — signed Fedora Silverblue 44 NVIDIA Open image for gaming and development"
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 44
blue-build-tag: none
alt-tags:
  - latest
platforms:
  - linux/amd64
labels:
  org.opencontainers.image.source: "https://github.com/mheci/doors"
  org.opencontainers.image.licenses: "Apache-2.0"

# A disposable Fedora 44 stage builds reviewed third-party tools without
# carrying their Cargo/CMake toolchains into the bootable image.
stages:
  - name: doors-tools-build
    from: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open:44
    modules:
      - type: script
        scripts:
          - build-wl-clip-persist.sh
          - build-anechoic.sh

modules:
  - from-file: modules/common.yml
  - from-file: modules/gnome.yml
  # Late MOK signing runs only with protected key material on trusted
  # publication events; candidate builds use disposable keys.
  - from-file: modules/secureboot.yml
  # BlueBuild installs the per-image Cosign policy first. Extend it only with
  # the fixed sibling Doors repositories that share this protected production key.
  - type: signing
  - type: script
    scripts:
      - configure-doors-signature-policy.sh
