---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: doors
description: "Doors — a signed BlueBuild Fedora Silverblue NVIDIA Open image for gaming and development"
base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open
image-version: 44
# BlueBuild is a compose tool, not a runtime dependency of the installed OS.
blue-build-tag: none
# Deliberately publish exactly one public tag. Do not add Fedora-version, ISO,
# desktop, or hardware variant tags without a new design decision.
alt-tags:
  - latest
platforms:
  - linux/amd64
# BlueBuild derives the OCI description from recipe metadata. Its source label
# defaults to empty, so set the public source explicitly; BlueBuild v0.9.37
# reports that benign final-label override during generation.
labels:
  org.opencontainers.image.source: "https://github.com/mheci/doors"
  org.opencontainers.image.licenses: "Apache-2.0"

# A disposable Fedora 44 build stage keeps the approved wl-clip-persist Cargo
# toolchain out of the bootable image. It resolves the newest upstream release
# commit at build time, uses that release's Cargo.lock, and records the chosen
# revision without tracking an unrelated mutable base tag.
stages:
  - name: wl-clip-persist-build
    from: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia-open:44
    modules:
      - type: script
        scripts:
          - build-wl-clip-persist.sh

modules:
  # Static reviewed repository keys and all system defaults are copied before
  # DNF sees the local repository definitions below.
  - type: files
    files:
      - source: system
        destination: /

  # The official BlueBuild Fedora Silverblue NVIDIA Open base carries its
  # own prebuilt, signed kernel/NVIDIA Open stack. Doors deliberately layers no
  # additional akmods, driver, kernel, or Mesa synchronization path.

  # All package resolution is strict: unavailable packages, resolver conflicts,
  # and failed verification abort the compose transaction rather than bypassing it.
  - type: dnf
    repos:
      cleanup: true
      # Keep Steam multilib compatible with the codec stack already selected by
      # the BlueBuild base. RPM Fusion conflicts with that Negativo17 stack.
      nonfree: negativo17
      files:
        - terra.repo
        - brave-origin.repo
        - faugus.repo
        - helium.repo
        - ublue-packages.repo
      keys:
        - terra44.gpg
        - brave.gpg
        - faugus.gpg
        - helium.gpg
        - ublue-packages.gpg
    remove:
      auto-remove: false
      packages:
        - firefox
        - firefox-langpacks
        - brave-browser
        - gamemode
        - gamemode-libs
    install:
      install-weak-deps: false
      exclude:
        - firefox
        - firefox-langpacks
        - brave-browser
        - gamemode
        - gamemode-libs
      packages:
        # Fedora-first developer and CLI baseline.
        - neovim
        - kitty
        - git
        - git-lfs
        - gh
        - just
        - jq
        - yq
        - curl
        - wget
        - gnupg2
        - unzip
        - distrobox
        - podman
        - uupd
        - eza
        - bat
        - ripgrep
        - fd-find
        - fzf
        - zoxide
        - htop
        - btop
        - nvtop
        - starship
        - lazygit
        - direnv
        - mpv
        - p7zip
        - unar
        - xz
        - zstd
        - grim
        - slurp
        - swappy
        - wf-recorder
        - cliphist
        - wl-clipboard

        # GNOME desktop integration and the RPM-delivered GNOME extensions.
        - blueman
        - network-manager-applet
        - system-config-printer
        - udisks2
        - gvfs
        - gvfs-smb
        - gvfs-mtp
        - gvfs-afc
        - dconf
        - yaru-theme
        - yaru-icon-theme
        - yaru-sound-theme
        - adw-gtk3-theme
        - rsms-inter-fonts
        - jetbrains-mono-fonts
        - fira-code-fonts
        - cascadia-code-fonts
        - google-roboto-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-fonts
        - papirus-icon-theme
        - numix-icon-theme
        - numix-gtk-theme
        - breeze-icon-theme
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection
        # This Fedora Silverblue base does not supply Bazzite's Terra package.
        # Install Fedora's signed Gamescope RPM directly; strict DNF resolution
        # remains authoritative for the NVIDIA/OpenGL/Vulkan dependency set.
        - gamescope
        - steam

        # Terra is the approved source for these components. They must be
        # resolved alongside their signed Fedora dependencies: BlueBuild's
        # per-repository selector would hide Fedora from DNF's dependency solver
        # and fail the transaction. The enabled repository set is strictly
        # reviewed; Faugus is additionally isolated below in its repo policy.
        - heroic-games-launcher
        - protonplus
        - umu-launcher
        - vesktop
        - falcond
        - falcond-profiles
        - ananicy-cpp
        - cachyos-ananicy-rules
        - scx-scheds
        - scx-tools
        - ghostty
        - zed
        - vicinae
        - gnome-shell-extension-vicinae
        - gnome-shell-extension-grand-theft-focus
        - zen-browser

        # Narrow, reviewed third-party exceptions. Helium and Brave Origin are
        # unique to their configured repositories. The Faugus repo's explicit
        # include/priority policy selects its project COPR while still allowing
        # dependencies from signed Fedora/Terra repositories.
        - faugus-launcher
        - helium-bin
        - brave-origin

  # Brave Origin requires its vendor keyring during installation. Retain only
  # the reviewed Origin signing keys afterward, not the keyring's beta/nightly
  # credentials or mutable key updater.
  - type: script
    scripts:
      - harden-brave-keyring.sh

  # Copy only final artifacts from the disposable Cargo build stage.
  - type: copy
    from: wl-clip-persist-build
    src: /out/wl-clip-persist
    dest: /usr/local/bin/wl-clip-persist
  - type: copy
    from: wl-clip-persist-build
    src: /out/wl-clip-persist.buildinfo
    dest: /usr/share/doors/third-party/wl-clip-persist.buildinfo

  # CI places an attestation-verified Herdr artifact in this ignored source
  # directory before invoking BlueBuild. Copy that directory's contents, not
  # its parent, as read-only input to the Doors AI Distrobox only.
  - type: files
    files:
      - source: generated/herdr
        destination: /usr/share/doors/distrobox/herdr

  # uupd is the sole automatic update coordinator. Its reviewed UBlue COPR RPM
  # is signature-checked, while the config keeps its system, Flatpak, and
  # Distrobox modules enabled and deliberately disables unmanaged Homebrew.
  - type: script
    scripts:
      - configure-uupd.sh

  # Latest GNOME-Shell-compatible releases from the official extensions
  # registry; use RPMs above where Fedora/Terra provides a signed package.
  - type: gnome-extensions
    install:
      - 779  # Clipboard Indicator
      - 4269 # Alphabetical App Grid
      - 6242 # Emoji Copy

  - type: script
    scripts:
      - configure-gnome-defaults.sh

  # BlueBuild's Fedora Silverblue base does not rely on Bazzite's Flatpak
  # preinstall descriptors. The policy script keeps one static, GPG-verified
  # Flathub remote; Doors' one first-networked-boot service installs only
  # Bazaar, DistroShelf, and their required runtime dependencies.
  - type: script
    scripts:
      - enforce-flatpak-policy.sh

  - type: systemd
    system:
      enabled:
        - falcond.service
        - ananicy-cpp.service
        - scx_loader.service
        # uupd is the single automatic coordinator for bootc, Flatpak, and
        # Distrobox updates. Avoid racing BlueBuild's individual update timers.
        - uupd.timer
        - doors-flatpak-bootstrap.service
      disabled:
        - bootc-fetch-apply-updates.timer
        - flatpak-system-updates.timer
    user:
      enabled:
        - doors-ai-distrobox.service
        - vicinae.service
        - wl-clip-persist.service
      disabled:
        - flatpak-user-updates.timer

  - type: script
    scripts:
      - verify-image.sh

  # Install bootc/rpm-ostree Cosign policy. The GitHub workflow supplies the
  # existing SIGNING_SECRET only for trusted publication events.
  - type: signing
