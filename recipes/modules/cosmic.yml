---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# COSMIC profile: a dark first-run default that never overrides user settings.
modules:
  - type: files
    files:
      - source: profiles/cosmic
        destination: /

  - type: systemd
    user:
      enabled:
        - doors-cosmic-dark-defaults.service

  - type: script
    scripts:
      - verify-cosmic-image.sh
