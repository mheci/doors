---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# GNOME-only profile for the stable Doors/Silverblue image and its staging twin.
modules:
  - type: files
    files:
      - source: profiles/gnome
        destination: /

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - dconf
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-gsconnect
        - gnome-shell-extension-just-perfection
        - gnome-shell-extension-vicinae
        - gnome-shell-extension-grand-theft-focus

  # Latest GNOME-Shell-compatible releases from the official extension registry;
  # RPMs above provide the extensions Fedora/Terra packages directly.
  - type: gnome-extensions
    install:
      - 779  # Clipboard Indicator
      - 4269 # Alphabetical App Grid
      - 6242 # Emoji Copy

  - type: script
    scripts:
      - configure-gnome-defaults.sh
      - verify-gnome-image.sh
