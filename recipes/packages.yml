---
# Shared: user-facing packages (decision D2 list). Resilience: skip-unavailable + no weak deps.
modules:
  - type: dnf
    remove:
      # falcond (Terra) hard-conflicts with Fedora's gamemode and provides the
      # `gamemode` capability itself, so Steam/Heroic/Faugus stay satisfied.
      # The Kinoite base image already ships gamemode; `exclude` only stops new
      # installs, so it must be removed here (no-autoremove keeps it surgical).
      packages:
        - gamemode
      auto-remove: false
    install:
      skip-unavailable: true
      install-weak-deps: false
      packages:
        # gaming
        # (steam is imported separately via steam.yml — universal images only;
        #  Terra's 32-bit NVIDIA tree is mid-migration and blocks it on -nvidia)
        - faugus-launcher
        - heroic-games-launcher
        - protonplus
        - umu-launcher
        - vesktop
        - gamescope
        # NOTE: system wine is intentionally NOT installed. Proton (Steam), umu-launcher
        # and Heroic ship their own wine/proton + dxvk/vkd3d at runtime; system wine
        # would additionally drag ~800MB of 32-bit libs (wine-core.i686 + gstreamer
        # i686) and is not part of the agreed package set.
        # browsers
        - firefox
        - zen-browser
        - brave-browser
        # editors / terminals
        - zed
        - neovim
        - ghostty
        - kitty
        # media
        - mpv
        # scheduler + game daemon (Terra)
        - scx-scheds
        - scx-tools
        - falcond
        - falcond-gui
        - falcond-profiles
        # ananicy gaming nice rules (CachyOS addons COPR)
        - ananicy-cpp
        - cachyos-ananicy-rules
        # desktop utils
        - blueman
        - network-manager-applet
        - system-config-printer
        - udisks2
        - gvfs
        - gvfs-smb
        - gvfs-mtp
        - gvfs-afc
        - pcmanfm-qt
        - ark
        - p7zip
        - unar
        - unzip
        - xz
        - zstd
        - grim
        - slurp
        - swappy
        - wf-recorder
        - cliphist
        - nwg-look
        - wlogout
        # CLI set
        - eza
        - bat
        - ripgrep
        - fd-find
        - fzf
        - zoxide
        - htop
        - btop
        - nvtop
        - starship
        - lazygit
        - direnv
        - git
        - git-lfs
        - gh
        - just
        - jq
        - yq
        - curl
        - wget
        - distrobox
        # fonts / themes / cursors / icons (verified Fedora package names)
        - rsms-inter-fonts
        - jetbrains-mono-fonts
        - fira-code-fonts
        - cascadia-code-fonts
        - google-roboto-fonts
        - abattis-cantarell-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-fonts
        - papirus-icon-theme
        - breeze-icon-theme
        - numix-icon-theme
        - numix-gtk-theme
        - kvantum
        - qt6ct

  # Flatpaks: Bazaar store, Flatseal, pwvucontrol mixer (author-recommended channel)
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - com.saivert.pwvucontrol
