---
# Shared: user-facing packages (decision D2 list). Resilience: skip-unavailable + no weak deps.
modules:
  - type: dnf
    install:
      skip-unavailable: true
      install-weak-deps: false
      packages:
        # gaming
        - steam
        - faugus-launcher
        - heroic-games-launcher
        - protonplus
        - umu-launcher
        - vesktop
        - gamescope
        # wine / compat (RPM Fusion + Terra extras)
        - wine-core
        - wine-core.i686
        - wine-mono
        - dxvk
        - dxvk.i686
        - vkd3d
        - vkd3d.i686
        # browsers
        - firefox
        - zen-browser
        - brave-browser
        # editors / terminals
        - zed
        - neovim
        - ghostty
        - kitty
        # media
        - mpv
        # scheduler + game daemon (Terra)
        - scx-scheds
        - scx-tools
        - falcond
        - falcond-gui
        - falcond-profiles
        # ananicy gaming nice rules (CachyOS addons COPR)
        - ananicy-cpp
        - cachyos-ananicy-rules
        # desktop utils
        - blueman
        - network-manager-applet
        - system-config-printer
        - udisks2
        - gvfs
        - gvfs-smb
        - gvfs-mtp
        - gvfs-afc
        - pcmanfm-qt
        - ark
        - p7zip
        - unar
        - unzip
        - xz
        - zstd
        - grim
        - slurp
        - swappy
        - wf-recorder
        - cliphist
        - nwg-displays
        - wlogout
        # CLI set
        - eza
        - bat
        - ripgrep
        - fd-find
        - fzf
        - zoxide
        - htop
        - btop
        - nvtop
        - starship
        - lazygit
        - direnv
        - git
        - git-lfs
        - gh
        - just
        - jq
        - yq
        - curl
        - wget
        - distrobox
        # fonts / themes / cursors / icons (verified Fedora package names)
        - rsms-inter-fonts
        - jetbrains-mono-fonts
        - fira-code-fonts
        - cascadia-code-fonts
        - google-roboto-fonts
        - abattis-cantarell-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-fonts
        - papirus-icon-theme
        - breeze-icon-theme
        - numix-icon-theme
        - numix-gtk-theme
        - kvantum
        - qt6ct

  # Flatpaks: Bazaar store, Flatseal, pwvucontrol mixer (author-recommended channel)
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - com.saivert.pwvucontrol
