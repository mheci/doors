---
# Steam (RPM Fusion nonfree).
# Imported ONLY by the universal images (doors, doors-wl, doors-cosmic).
# NOT imported by the -nvidia images: Terra's nvidia-driver-libs carries a
# conditional dependency `(nvidia-driver-libs(x86-32) = 3:610.57.04-1.fc44 if steam)`
# and Terra currently ships the 32-bit NVIDIA tree at 615.71.09 while the 64-bit
# tree is still 610.57.04 — so the 610 i686 provider does not exist and Steam
# cannot resolve there. Re-enable on -nvidia once Terra finishes the 610→615
# migration (see docs/DOORS-SPEC.md).
modules:
  - type: dnf
    install:
      skip-unavailable: true
      install-weak-deps: false
      packages:
        - steam
